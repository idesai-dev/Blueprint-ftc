name: Blueprint
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V7ZVB4VR8J
    CODE_SIGN_STYLE: Automatic
targets:
  Blueprint:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Blueprint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ftcblueprint.app
        PRODUCT_NAME: Blueprint
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Blueprint
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_OBJC_BRIDGING_HEADER: Blueprint/Bridging/Blueprint-Bridging-Header.h
    postBuildScripts:
      - name: Strip Extended Attributes
        script: |
          find "$TARGET_BUILD_DIR/$PRODUCT_NAME.app" -exec xattr -c {} \; 2>/dev/null || true
        basedOnDependencyAnalysis: false
schemes:
  Blueprint:
    build:
      targets:
        Blueprint: all
    run:
      config: Debug
    archive:
      config: Release
